[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --verbose
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --ignore=venv
    --ignore=env
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
